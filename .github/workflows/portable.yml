name: Instalación portable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  codigo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Reproducir y reparar falta de zonas horarias en entorno nuevo
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as temporary:
              venv = pathlib.Path(temporary) / 'venv'
              subprocess.run([sys.executable, '-m', 'venv', str(venv)], check=True)
              python = venv / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              env = dict(os.environ, PYTHONTZPATH='')
              missing = subprocess.run([str(python), '-m', 'scripts.runtime_check'], env=env)
              assert missing.returncode != 0, 'La prueba debe comenzar sin tzdata'
              subprocess.run([str(python), '-m', 'scripts.runtime_check', '--repair'], env=env, check=True)
              subprocess.run([str(python), '-m', 'scripts.runtime_check'], env=env, check=True)
      - run: python -m pip install -r requirements-quick.txt
      - name: Comprobar iniciador rápido Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: iniciar_rapido.cmd --prepare-only
      - name: Comprobar iniciador rápido macOS/Linux
        if: runner.os != 'Windows'
        run: sh iniciar_rapido.sh --prepare-only
      - run: python -m unittest discover -s tests
      - run: python -m scripts.verify_package
  instalacion-limpia:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Construir e instalar sin modelos ni entorno previos
        run: docker compose up --build --wait --wait-timeout 1500
      - name: Comprobar componentes y pruebas
        run: |
          docker compose exec -T app python -m scripts.container_start --health
          docker compose exec -T app python -m unittest discover -s tests
          docker compose exec -T app python -m scripts.verify_package
          curl --fail http://127.0.0.1:8000/api/status
      - name: Guardar evidencia de arranque
        if: always()
        run: docker compose logs --no-color > portable.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instalacion-limpia-linux
          path: portable.log
      - name: Limpiar entorno de prueba
        if: always()
        run: docker compose down --volumes
  iniciadores-nativos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preparar desde iniciador Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: iniciar.cmd --prepare-only > native.log 2>&1
      - name: Preparar desde iniciador macOS/Linux
        if: runner.os != 'Windows'
        run: sh iniciar.sh --prepare-only > native.log 2>&1
      - name: Verificar código e integridad Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          .runtime\venv\Scripts\python.exe -m unittest discover -s tests
          .runtime\venv\Scripts\python.exe -m scripts.verify_package
      - name: Verificar código e integridad macOS/Linux
        if: runner.os != 'Windows'
        run: |
          .runtime/venv/bin/python -m unittest discover -s tests
          .runtime/venv/bin/python -m scripts.verify_package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iniciador-${{ matrix.os }}
          path: native.log
